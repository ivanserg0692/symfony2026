upstream php_fpm {
    server 127.0.0.1:9000;
    # This value equals PHP_FPM_MAX_CHILDREN only while Nginx uses one worker.
    # Nginx maintains one keepalive pool per worker, so with multiple workers it
    # must be floor(PHP_FPM_MAX_CHILDREN / NGINX_WORKER_PROCESSES).
    keepalive __FASTCGI_KEEPALIVE_PER_WORKER__;
}

server {
    listen 8000;
    server_name _;

    root /workspace/public;
    index index.php;

    client_max_body_size 20m;
    fastcgi_keep_conn on;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
