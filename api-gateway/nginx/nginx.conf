load_module modules/ngx_http_vhost_traffic_status_module.so;

user  nginx;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  'time="$time_iso8601" '
                      'client="$remote_addr" '
                      'host="$host" '
                      'request="$request" '
                      'request_uri="$request_uri" '
                      'status="$status" '
                      'body_bytes_sent="$body_bytes_sent" '
                      'request_time="$request_time" '
                      'upstream_addr="$upstream_addr" '
                      'upstream_status="$upstream_status" '
                      'upstream_response_time="$upstream_response_time" '
                      'upstream_connect_time="$upstream_connect_time" '
                      'upstream_header_time="$upstream_header_time" '
                      'referer="$http_referer" '
                      'user_agent="$http_user_agent" '
                      'x_forwarded_for="$http_x_forwarded_for" '
                      'x_debug_token="$upstream_http_x_debug_token" '
                      'sent_x_debug_token="$sent_http_x_debug_token" '
                      'x_debug_token_link="$upstream_http_x_debug_token_link"';

    map $http_cookie $auth_cookie_present {
        default 1;
        "" 0;
    }

    map $http_authorization $auth_authorization_present {
        default 1;
        "" 0;
    }

    map $status $auth_5xx_loggable {
        default 0;
        500 1;
        502 1;
        503 1;
        504 1;
    }

    log_format auth_debug 'time="$time_iso8601" '
                          'client="$remote_addr" '
                          'host="$host" '
                          'request="$request" '
                          'uri="$uri" '
                          'request_uri="$request_uri" '
                          'status="$status" '
                          'request_time="$request_time" '
                          'upstream_addr="$upstream_addr" '
                          'upstream_status="$upstream_status" '
                          'upstream_response_time="$upstream_response_time" '
                          'upstream_connect_time="$upstream_connect_time" '
                          'upstream_header_time="$upstream_header_time" '
                          'auth_cookie_present="$auth_cookie_present" '
                          'authorization_present="$auth_authorization_present" '
                          'x_debug_token="$upstream_http_x_debug_token" '
                          'x_debug_token_link="$upstream_http_x_debug_token_link"';

    access_log  /dev/stdout  main;

    sendfile        on;

    keepalive_timeout  65;

    vhost_traffic_status_zone shared:api_gateway_vts:32m;
    vhost_traffic_status_histogram_buckets 0.005 0.01 0.025 0.05 0.1 0.25 0.5 1 2.5 5 10;

    include /etc/nginx/conf.d/*.conf;
}
