upstream symfony_web {
    zone symfony_web 64k;
    server symfony-web:8000;
}

upstream catalog_web {
    zone catalog_web 64k;
    server catalog-web:8000;
}

upstream cart_web {
    zone cart_web 64k;
    server cart-web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location @gateway_unauthorized {
        internal;
        default_type application/json;
        return 401 '{"message":"Authentication required."}\n';
    }

    location @gateway_forbidden {
        internal;
        default_type application/json;
        return 403 '{"message":"Access denied."}\n';
    }

    location @gateway_auth_unavailable {
        internal;
        default_type application/json;
        return 503 '{"message":"Authentication service unavailable."}\n';
    }

    location = /_auth {
        internal;

        access_log /var/log/nginx/auth-debug.log auth_debug;

        proxy_pass http://symfony_web/api/v1/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        include /etc/nginx/snippets/proxy-common.conf;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-User-Id "";
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    include /etc/nginx/snippets/generated-api-gateway-routes.conf;

    location ^~ /api/ {
        default_type application/json;
        return 404 '{"message":"Not found."}\n';
    }
}

server {
    listen 8080;
    server_name _;

    location = /vts/metrics {
        vhost_traffic_status_display;
        vhost_traffic_status_display_format prometheus;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
