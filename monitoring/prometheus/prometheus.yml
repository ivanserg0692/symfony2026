global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          project: prometheus

  - job_name: symfony-http
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - symfony-web:8000
        labels:
          project: symfony

  - job_name: catalog-http
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - catalog-web:8000
        labels:
          project: catalog

  - job_name: cart-http
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - cart-web:8000
        labels:
          project: cart

  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway-exporter:9113
        labels:
          project: api-gateway

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          project: node

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          project: postgres

  - job_name: catalog-postgres
    static_configs:
      - targets:
          - catalog-postgres-exporter:9187
        labels:
          project: catalog-postgres

  - job_name: cart-postgres
    static_configs:
      - targets:
          - cart-postgres-exporter:9187
        labels:
          project: cart-postgres
