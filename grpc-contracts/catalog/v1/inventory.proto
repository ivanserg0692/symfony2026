syntax = "proto3";

package catalog.v1;

option php_namespace = "Grpc\\Catalog\\V1";
option php_metadata_namespace = "Grpc\\Catalog\\V1\\GPBMetadata";

service InventoryService {
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
  rpc DeductStocks(DeductStocksRequest) returns (DeductStocksResponse);
}

message CheckStockRequest {
  int64 product_id = 1;
  int32 requested_quantity = 2;
}

message CheckStockResponse {
  int64 product_id = 1;
  int32 total_available_quantity = 2;
  bool available = 3;
  repeated StoreStock stores = 4;
}

message StoreStock {
  int64 store_id = 1;
  int32 available_quantity = 2;
}

message DeductStocksRequest {
  string operation_id = 1;
  repeated DeductStockItem items = 2;
}

message DeductStockItem {
  int64 product_id = 1;
  int32 requested_quantity = 2;

  oneof store_selector {
    int64 store_id = 3;
  }
}

message DeductStocksResponse {
  string operation_id = 1;
  repeated ProductDeduction products = 2;
}

message ProductDeduction {
  int64 product_id = 1;
  int32 total_deducted_quantity = 2;
  repeated StoreDeduction stores = 3;
  int64 product_snapshot_id = 4;
}

message StoreDeduction {
  int64 store_id = 1;
  int32 deducted_quantity = 2;
}
