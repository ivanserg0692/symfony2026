syntax = "proto3";

package catalog.v1;

option php_namespace = "Grpc\\Catalog\\V1";
option php_metadata_namespace = "Grpc\\Catalog\\V1\\GPBMetadata";

service InventoryService {
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);
}

message CheckStockRequest {
  int64 product_id = 1;
  int32 requested_quantity = 2;
}

message CheckStockResponse {
  int64 product_id = 1;
  int32 total_available_quantity = 2;
  bool available = 3;
  repeated StoreStock stores = 4;
}

message StoreStock {
  int64 store_id = 1;
  int32 available_quantity = 2;
}
