apiVersion: apps/v1
kind: Deployment
metadata: {name: database-exporter, namespace: __APP_NAMESPACE__}
spec:
  replicas: 1
  selector: {matchLabels: {app: database-exporter}}
  template:
    metadata: {labels: {app: database-exporter}}
    spec:
      initContainers:
        - name: wait-database
          image: postgres:16-alpine
          command: [sh, -ec, 'until pg_isready -h database -p 5432; do sleep 5; done']
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:latest
          env:
            - {name: DATA_SOURCE_URI, valueFrom: {configMapKeyRef: {name: db-exporter-config, key: AUTH_DB_URI}}}
            - {name: DATA_SOURCE_USER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_USER}}}
            - {name: DATA_SOURCE_PASS, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_PASSWORD}}}
          ports: [{name: metrics, containerPort: 9187}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: database-exporter, namespace: __APP_NAMESPACE__}
spec: {selector: {app: database-exporter}, ports: [{name: metrics, port: 9187}]}
---
