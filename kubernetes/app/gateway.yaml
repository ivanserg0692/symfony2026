apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway, service: gateway, component: http}}
    spec:
      containers:
        - name: nginx
          image: symfony-api-gateway-nginx:1.27-vts
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 80}, {name: vts, containerPort: 8080}]
          volumeMounts:
            - {name: gateway-main, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: gateway-main, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: gateway-snippets, mountPath: /etc/nginx/snippets, readOnly: true}
          readinessProbe: {tcpSocket: {port: 80}, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 256Mi}}
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:latest
          args: [--nginx.scrape-uri=http://127.0.0.1/nginx_status]
          ports: [{name: nginx-metrics, containerPort: 9113}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
      volumes:
        - {name: gateway-main, configMap: {name: gateway-main}}
        - {name: gateway-snippets, configMap: {name: gateway-snippets}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway}
spec:
  selector: {app: api-gateway}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: nginx-metrics, port: 9113, targetPort: nginx-metrics}
    - {name: vts, port: 8080, targetPort: vts}
