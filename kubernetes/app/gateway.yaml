apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: __APP_NAMESPACE__}
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway, service: gateway, component: http}}
    spec:
      initContainers:
        - name: wait-http-upstreams
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -ec
            - |
              for service in symfony-web catalog-web cart-web; do
                until status="$(curl --silent --output /dev/null --max-time 3 --write-out '%{http_code}' "http://${service}:8000/")" &&
                      [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; do sleep 5; done
              done
      containers:
        - name: nginx
          image: __API_GATEWAY_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 80}, {name: vts, containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 80}, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 256Mi}}
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:latest
          args: [--nginx.scrape-uri=http://127.0.0.1/nginx_status]
          ports: [{name: nginx-metrics, containerPort: 9113}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: __APP_NAMESPACE__}
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  selector: {app: api-gateway}
  ports:
    - {name: http, port: 8001, targetPort: http}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway-metrics, namespace: __APP_NAMESPACE__}
spec:
  type: ClusterIP
  selector: {app: api-gateway}
  ports:
    - {name: nginx-metrics, port: 9113, targetPort: nginx-metrics}
    - {name: vts, port: 8080, targetPort: vts}
