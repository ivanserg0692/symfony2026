# Namespace is supplied by kubectl; no manifest depends on kind or node names.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: symfony-web}
  template:
    metadata:
      labels: {app: symfony-web, service: auth, component: http}
      annotations: {monitoring.symfony2026/php-fpm: "true"}
    spec:
      securityContext: {fsGroup: 33}
      containers:
        - name: php
          image: symfony-auth:k8s
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}, {name: fpm-status, containerPort: 9001}]
          envFrom:
            - configMapRef: {name: auth-config}
            - secretRef: {name: auth-config-secret}
          env:
            - name: JWT_PASSPHRASE
              valueFrom: {secretKeyRef: {name: auth-jwt, key: JWT_PASSPHRASE}}
          volumeMounts:
            - {name: jwt, mountPath: /workspace/config/jwt, readOnly: true}
          startupProbe: {tcpSocket: {port: 8000}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8000}, periodSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:2.2.0
          env: [{name: PHP_FPM_SCRAPE_URI, value: "tcp://127.0.0.1:9001/status"}]
          ports: [{name: fpm-metrics, containerPort: 9253}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
      volumes:
        - name: jwt
          secret:
            secretName: auth-jwt
            defaultMode: 288
            items: [{key: private.pem, path: private.pem}, {key: public.pem, path: public.pem}]
---
apiVersion: v1
kind: Service
metadata: {name: symfony-web}
spec:
  selector: {app: symfony-web}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog-web}
spec:
  replicas: 1
  selector: {matchLabels: {app: catalog-web}}
  template:
    metadata:
      labels: {app: catalog-web, service: catalog, component: http}
      annotations: {monitoring.symfony2026/php-fpm: "true"}
    spec:
      containers:
        - name: php
          image: symfony-catalog:k8s
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}, {name: fpm-status, containerPort: 9001}]
          envFrom: [{configMapRef: {name: catalog-config}}, {secretRef: {name: catalog-config-secret}}]
          startupProbe: {tcpSocket: {port: 8000}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 8000}, periodSeconds: 10, failureThreshold: 6}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:2.2.0
          env: [{name: PHP_FPM_SCRAPE_URI, value: "tcp://127.0.0.1:9001/status"}]
          ports: [{name: fpm-metrics, containerPort: 9253}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog-web}
spec:
  selector: {app: catalog-web}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
