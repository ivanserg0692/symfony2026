apiVersion: v1
kind: Service
metadata: {name: redis-symfony}
spec: {selector: {app: redis-symfony}, ports: [{name: redis, port: 6379}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis-symfony}
spec:
  serviceName: redis-symfony
  replicas: 1
  selector: {matchLabels: {app: redis-symfony}}
  template:
    metadata: {labels: {app: redis-symfony}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports: [{name: redis, containerPort: 6379}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 256Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
