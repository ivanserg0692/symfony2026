apiVersion: v1
kind: Service
metadata: {name: kibana, namespace: {{ .Release.Namespace }}}
spec: {selector: {app: kibana}, ports: [{name: http, port: 5601}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana, namespace: {{ .Release.Namespace }}}
spec:
  replicas: {{ index .Values.replicas "kibana" }}
  selector: {matchLabels: {app: kibana}}
  template:
    metadata: {labels: {app: kibana}}
    spec:
      initContainers:
        - name: wait-elasticsearch-credentials
          image: curlimages/curl:8.14.1
          command: [sh, -ec, 'until curl --fail --silent --output /dev/null --user "kibana_system:${KIBANA_PASSWORD}" http://elasticsearch:9200/_security/_authenticate; do sleep 5; done']
          env: [{name: KIBANA_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: KIBANA_PASSWORD}}}]
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.5.2
          env:
            - {name: ELASTICSEARCH_HOSTS, value: '["http://elasticsearch:9200"]'}
            - {name: ELASTICSEARCH_USERNAME, value: kibana_system}
            - {name: ELASTICSEARCH_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: KIBANA_PASSWORD}}}
          ports: [{name: http, containerPort: 5601}]
          startupProbe: {tcpSocket: {port: 5601}, periodSeconds: {{ index .Values.probes "kibana" "startupProbe" "periodSeconds" }}, failureThreshold: {{ index .Values.probes "kibana" "startupProbe" "failureThreshold" }}}
          resources:
{{ toYaml (index .Values.resources "kibana" "kibana") | indent 12 }}
