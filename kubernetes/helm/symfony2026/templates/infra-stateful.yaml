apiVersion: v1
kind: Service
metadata: {name: database, namespace: {{ .Release.Namespace }}}
spec: {selector: {app: database}, ports: [{name: postgres, port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: database, namespace: {{ .Release.Namespace }}}
spec:
  serviceName: database
  replicas: {{ index .Values.replicas "database" }}
  selector: {matchLabels: {app: database}}
  template:
    metadata: {labels: {app: database}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          command: [sh, -ec]
          args: ['exec docker-entrypoint.sh postgres -c "max_connections=$POSTGRES_MAX_CONNECTIONS"']
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_MAX_CONNECTIONS, valueFrom: {configMapKeyRef: {name: {{ include "symfony2026.capacityConfigMapName" (dict "root" . "service" "auth") }}, key: POSTGRES_MAX_CONNECTIONS}}}
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_DB}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, periodSeconds: {{ index .Values.probes "database" "readinessProbe" "periodSeconds" }}}
          resources:
{{ toYaml (index .Values.resources "database" "postgres") | indent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
