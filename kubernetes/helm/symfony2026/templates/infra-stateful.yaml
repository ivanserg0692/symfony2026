apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: {{ .Release.Namespace }}}
spec: {selector: {app: rabbitmq}, ports: [{name: amqp, port: 5672}, {name: management, port: 15672}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: {{ .Release.Namespace }}}
spec:
  serviceName: rabbitmq
  replicas: {{ index .Values.replicas "rabbitmq" }}
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata: {labels: {app: rabbitmq}}
    spec:
      securityContext: {fsGroup: 999}
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management
          env:
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: RABBITMQ_DEFAULT_USER}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: infra-config-secret, key: RABBITMQ_DEFAULT_PASS}}}
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          readinessProbe: {tcpSocket: {port: amqp}, periodSeconds: {{ index .Values.probes "rabbitmq" "readinessProbe" "periodSeconds" }}}
          resources:
{{ toYaml (index .Values.resources "rabbitmq" "rabbitmq") | indent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch, namespace: {{ .Release.Namespace }}}
spec: {selector: {app: elasticsearch}, ports: [{name: http, port: 9200}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: elasticsearch, namespace: {{ .Release.Namespace }}}
spec:
  serviceName: elasticsearch
  replicas: {{ index .Values.replicas "elasticsearch" }}
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata: {labels: {app: elasticsearch}}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
          args: [elasticsearch, '-Ediscovery.type=single-node', '-Enode.store.allow_mmap=false', '-Expack.security.enabled=true', '-Expack.license.self_generated.type=basic']
          env:
            - {name: ELASTIC_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: ELASTIC_PASSWORD}}}
            - {name: ES_JAVA_OPTS, value: '-Xms1g -Xmx1g'}
          ports: [{name: http, containerPort: 9200}]
          volumeMounts: [{name: data, mountPath: /usr/share/elasticsearch/data}]
          startupProbe: {tcpSocket: {port: 9200}, periodSeconds: {{ index .Values.probes "elasticsearch" "startupProbe" "periodSeconds" }}, failureThreshold: {{ index .Values.probes "elasticsearch" "startupProbe" "failureThreshold" }}}
          readinessProbe: {tcpSocket: {port: 9200}, periodSeconds: {{ index .Values.probes "elasticsearch" "readinessProbe" "periodSeconds" }}}
          resources:
{{ toYaml (index .Values.resources "elasticsearch" "elasticsearch") | indent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: {{ .Release.Namespace }}}
spec: {selector: {app: minio}, ports: [{name: s3, port: 9000}, {name: console, port: 9001}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: minio, namespace: {{ .Release.Namespace }}}
spec:
  serviceName: minio
  replicas: {{ index .Values.replicas "minio" }}
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: {{ .Values.images.minio }}
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ':9001']
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: MINIO_ROOT_USER}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: MINIO_ROOT_PASSWORD}}}
          ports: [{name: s3, containerPort: 9000}, {name: console, containerPort: 9001}]
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, periodSeconds: {{ index .Values.probes "minio" "readinessProbe" "periodSeconds" }}}
          resources:
{{ toYaml (index .Values.resources "minio" "minio") | indent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 5Gi}}}
---
