apiVersion: v1
kind: ServiceAccount
metadata: {name: release-job-reader, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: release-job-reader, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: release-job-reader, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: release-job-reader}
subjects: [{kind: ServiceAccount, name: release-job-reader, namespace: {{ .Release.Namespace }}}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: migration-db-reader, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: migration-db-reader, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: migration-db-reader, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: migration-db-reader}
subjects: [{kind: ServiceAccount, name: migration-db-reader, namespace: {{ .Release.Namespace }}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: elasticsearch-setup, namespace: {{ .Release.Namespace }}, annotations: {"helm.sh/hook": "post-install,post-upgrade,post-rollback", "helm.sh/hook-delete-policy": "before-hook-creation"}}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: curlimages/curl:8.14.1
          command: [sh, -ec]
          args:
            - |
              until curl --fail --silent --user "elastic:${ELASTIC_PASSWORD}" http://elasticsearch:9200/_cluster/health >/dev/null; do sleep 5; done
              curl --fail --silent --show-error --user "elastic:${ELASTIC_PASSWORD}" \
                --header 'Content-Type: application/json' --request POST \
                http://elasticsearch:9200/_security/user/kibana_system/_password \
                --data "{\"password\":${KIBANA_PASSWORD_JSON}}"
          env:
            - {name: ELASTIC_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: ELASTIC_PASSWORD}}}
            - {name: KIBANA_PASSWORD_JSON, valueFrom: {secretKeyRef: {name: infra-config-secret, key: KIBANA_PASSWORD_JSON}}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: minio-bucket-setup, namespace: {{ .Release.Namespace }}, annotations: {"helm.sh/hook": "post-install,post-upgrade,post-rollback", "helm.sh/hook-delete-policy": "before-hook-creation"}}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: migration-db-reader
      initContainers:
        - name: wait-minio-rollout
          image: bitnamilegacy/kubectl:1.33.4
          command: [sh, -ec]
          args:
            - |
              until [ "$(kubectl get statefulset/minio -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)" = "$EXPECTED_IMAGE" ]; do sleep 5; done
              generation="$(kubectl get statefulset/minio -o jsonpath='{.metadata.generation}')"
              kubectl wait --for="jsonpath={.status.observedGeneration}=$generation" statefulset/minio --timeout=3600s
              kubectl rollout status statefulset/minio --timeout=3600s
              status="$(kubectl get statefulset/minio -o jsonpath='{.metadata.generation} {.status.observedGeneration} {.spec.replicas} {.status.updatedReplicas} {.status.readyReplicas} {.status.currentRevision} {.status.updateRevision}')"
              set -- $status
              [ "$1" = "$2" ] && [ "$3" = "$4" ] && [ "$3" = "$5" ] && [ "$6" = "$7" ]
              [ "$(kubectl get statefulset/minio -o jsonpath='{.spec.template.spec.containers[0].image}')" = "$EXPECTED_IMAGE" ]
          env: [{name: EXPECTED_IMAGE, value: '{{ .Values.images.minio }}'}]
      containers:
        - name: setup
          image: {{ .Values.images.mc }}
          imagePullPolicy: IfNotPresent
          command: [sh, -ec]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null; do sleep 5; done
              mc mb --ignore-existing "local/${MINIO_BUCKET}"
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: MINIO_ROOT_USER}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: MINIO_ROOT_PASSWORD}}}
            - {name: MINIO_BUCKET, valueFrom: {secretKeyRef: {name: infra-config-secret, key: MINIO_BUCKET}}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: auth-migrate, namespace: {{ .Release.Namespace }}, annotations: {"helm.sh/hook": "post-install,post-upgrade,post-rollback", "helm.sh/hook-delete-policy": "before-hook-creation"}}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: migration-db-reader
      securityContext: {fsGroup: 33}
      initContainers:
        - name: wait-database-rollout
          image: bitnamilegacy/kubectl:1.33.4
          command: [sh, -ec]
          args:
            - |
              until [ "$(kubectl get statefulset/database -o jsonpath='{.spec.template.spec.containers[0].env[0].valueFrom.configMapKeyRef.name}' 2>/dev/null)" = "$EXPECTED_CONFIGMAP" ]; do sleep 5; done
              kubectl rollout status statefulset/database --timeout=3600s
          env: [{name: EXPECTED_CONFIGMAP, value: {{ .Values.capacityConfigMaps.auth }}}]
        - name: wait-database
          image: postgres:16-alpine
          command: [sh, -ec]
          args:
            - |
              until actual="$(psql -w -h database -p 5432 -U "$PGUSER" -d "$PGDATABASE" -Atqc 'SHOW max_connections' 2>/dev/null)" &&
                    [ "$actual" = "$POSTGRES_MAX_CONNECTIONS" ]; do sleep 5; done
          env:
            - {name: PGUSER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_USER}}}
            - {name: PGDATABASE, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_DB}}}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: infra-config-secret, key: POSTGRES_PASSWORD}}}
            - {name: POSTGRES_MAX_CONNECTIONS, valueFrom: {configMapKeyRef: {name: {{ .Values.capacityConfigMaps.auth }}, key: POSTGRES_MAX_CONNECTIONS}}}
      containers:
        - name: migrate
          image: {{ .Values.images.auth }}
          imagePullPolicy: IfNotPresent
          command: [php, bin/console, doctrine:migrations:migrate, --no-interaction]
          envFrom: [{configMapRef: {name: auth-config}}, {secretRef: {name: auth-config-secret}}]
          env: [{name: JWT_PASSPHRASE, valueFrom: {secretKeyRef: {name: auth-jwt, key: JWT_PASSPHRASE}}}]
          volumeMounts: [{name: jwt, mountPath: /workspace/config/jwt, readOnly: true}]
      volumes: [{name: jwt, secret: {secretName: auth-jwt, defaultMode: 288, items: [{key: private.pem, path: private.pem}, {key: public.pem, path: public.pem}]}}]
---
