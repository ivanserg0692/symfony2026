# The namespace placeholder is rendered from K8S_NAMESPACE at deploy time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-web
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ index .Values.replicas "symfony-web" }}
  selector:
    matchLabels: {app: symfony-web}
  template:
    metadata:
      labels: {app: symfony-web, service: auth, component: http}
      annotations: {monitoring.symfony2026/php-fpm: "true"}
    spec:
      securityContext: {fsGroup: 33}
      serviceAccountName: release-job-reader
      initContainers:
        - name: wait-auth-bootstrap
          image: bitnamilegacy/kubectl:1.33.4
          command: [sh, -ec]
          args:
            - |
              until kubectl get job/auth-migrate >/dev/null 2>&1; do sleep 5; done
              actual="$(kubectl get job/auth-migrate -o jsonpath='{.spec.template.spec.containers[0].image}')"
              [ "$actual" = "$EXPECTED_AUTH_IMAGE" ] || { echo "auth-migrate image $actual differs from $EXPECTED_AUTH_IMAGE" >&2; exit 1; }
              kubectl wait --for=condition=complete job/auth-migrate --timeout=3600s
              until kubectl get job/minio-bucket-setup >/dev/null 2>&1; do sleep 5; done
              actual="$(kubectl get job/minio-bucket-setup -o jsonpath='{.spec.template.spec.containers[0].image}')"
              [ "$actual" = "$EXPECTED_MC_IMAGE" ] || { echo "minio-bucket-setup image $actual differs from $EXPECTED_MC_IMAGE" >&2; exit 1; }
              kubectl wait --for=condition=complete job/minio-bucket-setup --timeout=3600s
          env:
            - {name: EXPECTED_AUTH_IMAGE, value: '{{ .Values.images.auth }}'}
            - {name: EXPECTED_MC_IMAGE, value: '{{ .Values.images.mc }}'}
        - name: wait-database
          image: postgres:16-alpine
          command: [sh, -ec, 'until pg_isready -h database -p 5432; do sleep 5; done']
        - name: wait-redis
          image: redis:7-alpine
          command: [sh, -ec, 'until [ "$(redis-cli -h redis-symfony ping)" = PONG ]; do sleep 5; done']
        - name: wait-rabbitmq
          image: curlimages/curl:8.14.1
          command: [sh, -ec, 'until curl --fail --silent --output /dev/null --user "${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}" http://rabbitmq:15672/api/health/checks/ready-to-serve-clients; do sleep 5; done']
          env:
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {secretKeyRef: {name: infra-config-secret, key: RABBITMQ_DEFAULT_USER}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: infra-config-secret, key: RABBITMQ_DEFAULT_PASS}}}
      containers:
        - name: php
          image: {{ .Values.images.auth }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}, {name: fpm-status, containerPort: 9001}]
          envFrom:
            - configMapRef: {name: auth-config}
            - secretRef: {name: auth-config-secret}
          env:
            - name: JWT_PASSPHRASE
              valueFrom: {secretKeyRef: {name: auth-jwt, key: JWT_PASSPHRASE}}
          volumeMounts:
            - {name: jwt, mountPath: /workspace/config/jwt, readOnly: true}
          startupProbe: {tcpSocket: {port: 8000}, periodSeconds: {{ index .Values.probes "symfony-web" "startupProbe" "periodSeconds" }}, failureThreshold: {{ index .Values.probes "symfony-web" "startupProbe" "failureThreshold" }}}
          readinessProbe: {tcpSocket: {port: 8000}, periodSeconds: {{ index .Values.probes "symfony-web" "readinessProbe" "periodSeconds" }}}
          livenessProbe: {tcpSocket: {port: 8000}, periodSeconds: {{ index .Values.probes "symfony-web" "livenessProbe" "periodSeconds" }}, failureThreshold: {{ index .Values.probes "symfony-web" "livenessProbe" "failureThreshold" }}}
          resources:
{{ toYaml (index .Values.resources "symfony-web" "php") | indent 12 }}
        - name: php-fpm-exporter
          image: hipages/php-fpm_exporter:2.2.0
          env: [{name: PHP_FPM_SCRAPE_URI, value: "tcp://127.0.0.1:9001/status"}]
          ports: [{name: fpm-metrics, containerPort: 9253}]
          resources:
{{ toYaml (index .Values.resources "symfony-web" "php-fpm-exporter") | indent 12 }}
      volumes:
        - name: jwt
          secret:
            secretName: auth-jwt
            defaultMode: 288
            items: [{key: private.pem, path: private.pem}, {key: public.pem, path: public.pem}]
---
apiVersion: v1
kind: Service
metadata: {name: symfony-web, namespace: {{ .Release.Namespace }}}
spec:
  selector: {app: symfony-web}
  ports: [{name: http, port: 8000, targetPort: http}]
