{{- range $name := list "symfony-web" "catalog-web" "cart-web" }}
{{- $autoscaling := index $.Values.autoscaling $name }}
{{- if $autoscaling.enabled }}
{{- $maximum := int (index $.Values.maxReplicas $name) }}
{{- if lt $maximum (int $autoscaling.minReplicas) }}
{{- fail (printf "maxReplicas.%s must be at least autoscaling.%s.minReplicas" $name $name) }}
{{- end }}
{{- if not $autoscaling.metrics.phpFpmQueue.enabled }}
{{- fail (printf "autoscaling.%s requires metrics.phpFpmQueue.enabled" $name) }}
{{- end }}
{{- if lt (int $autoscaling.metrics.phpFpmQueue.targetAverageValue) 1 }}
{{- fail (printf "autoscaling.%s.metrics.phpFpmQueue.targetAverageValue must be positive" $name) }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $maximum }}
  metrics:
    - type: Pods
      pods:
        metric:
          name: phpfpm_listen_queue
        target:
          type: AverageValue
          averageValue: {{ $autoscaling.metrics.phpFpmQueue.targetAverageValue | quote }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ $autoscaling.behavior.scaleUp.stabilizationWindowSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ $autoscaling.behavior.scaleDown.stabilizationWindowSeconds }}
{{- end }}
{{- end }}
