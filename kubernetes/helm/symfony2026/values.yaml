# Example references for chart rendering; scripts/k8s-deploy.sh supplies release images.
images:
  auth: symfony-auth:latest
  catalog: symfony-catalog:latest
  cart: symfony-cart:latest
  gateway: symfony-api-gateway-nginx:latest
  minio: symfony-minio:latest
  mc: symfony-mc:latest
  prometheus: symfony-prometheus:latest
  grafana: symfony-grafana:latest

# Supply computed application data and capacity with -f generated-values.yaml.
# Capacity examples allow structural chart checks without generated values.
generated:
  config: {}
  postgresCapacity:
    auth: "64"
    catalog: "92"
    cart: "60"

replicas:
  api-gateway: 1
  auth-async-worker: 1
  cart-db: 1
  cart-db-exporter: 1
  cart-web: 1
  catalog-db: 1
  catalog-db-exporter: 1
  catalog-grpc: 1
  catalog-search-index-worker: 1
  catalog-search-outbox-worker: 1
  catalog-web: 1
  database: 1
  database-exporter: 1
  elasticsearch: 1
  grafana: 1
  grafana-image-renderer: 1
  kibana: 1
  kube-state-metrics: 1
  mailpit: 1
  minio: 1
  prometheus: 1
  rabbitmq: 1
  redis-cart: 1
  redis-catalog: 1
  redis-metrics: 1
  redis-symfony: 1
  symfony-web: 1

# Per-workload container CPU/memory requests and limits. Omitted CPU limits remain unset.
