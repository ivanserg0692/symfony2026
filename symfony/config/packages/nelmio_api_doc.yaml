nelmio_api_doc:
    html_config:
        assets_mode: offline
        swagger_ui_config:
            urls:
                - name: Symfony API
                  url: /api/v1/doc.json
                - name: Catalog API
                  url: http://localhost:8010/api/doc.json
            urls.primaryName: Symfony API
    documentation:
        info:
            title: Symfony2026 API
            description: API documentation for version 1 endpoints.
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
    areas:
        default:
            path_patterns:
                - ^/api/v1(?!/doc(?:\.json)?$)
