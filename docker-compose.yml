services:
  # PostgreSQL database used by the Symfony application.
  database:
    image: postgres:16-alpine
    container_name: symfony-db
    env_file:
      - .env
      - .env.local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d app -U app"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data

  # PostgreSQL database used by the Catalog service.
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    env_file:
      - .env
      - .env.local
    environment:
      POSTGRES_DB: ${CATALOG_POSTGRES_DB:-catalog}
      POSTGRES_USER: ${CATALOG_POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${CATALOG_POSTGRES_PASSWORD:-catalog}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - catalog_database_data:/var/lib/postgresql/data

  # PostgreSQL database used by the Cart service.
  cart-db:
    image: postgres:16-alpine
    container_name: cart-db
    env_file:
      - .env
      - .env.local
    environment:
      POSTGRES_DB: ${CART_POSTGRES_DB:-cart}
      POSTGRES_USER: ${CART_POSTGRES_USER:-cart}
      POSTGRES_PASSWORD: ${CART_POSTGRES_PASSWORD:-cart}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - cart_database_data:/var/lib/postgresql/data

  # CLI PHP workspace for running Symfony, Composer, console commands, and tests.
  # Usage examples:
  # docker compose run --rm symfony-cli php bin/console
  # docker compose run --rm symfony-cli composer install
  # docker compose run --rm symfony-cli php bin/phpunit
  symfony-cli: &symfony-base
    build:
      context: .
      dockerfile: docker/php-symfony-cli/Dockerfile
      args:
        UBUNTU_VERSION: "24.04"
    image: symfony-cli:dev
    container_name: symfony-cli
    working_dir: /workspace
    volumes:
      - ./symfony:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - .env.local
    environment:
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}
    entrypoint:
      - /usr/local/bin/symfony-entrypoint
    command:
      - bash
    stdin_open: true
    tty: true

  # Local Symfony web server for browser/API access during development.
  symfony-web:
    <<: *symfony-base
    container_name: symfony-web
    command:
      - sh
      - -lc
      - /root/.symfony5/bin/symfony server:stop || true; /root/.symfony5/bin/symfony serve --allow-http --no-tls --listen-ip=0.0.0.0 --port=8000 --daemon; exec tail -f /dev/null
    ports:
      - "8000:8000"
    stdin_open: false
    tty: false

  # Public REST entry point for browser and API clients.
  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    depends_on:
      - symfony-web
      - catalog-web
      - cart-web
    ports:
      - "${API_GATEWAY_HTTP_PORT:-8001}:80"
    volumes:
      - ./api-gateway/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api-gateway/nginx/snippets:/etc/nginx/snippets:ro

  # Prometheus exporter for API Gateway / Nginx runtime metrics.
  api-gateway-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: api-gateway-exporter
    depends_on:
      - api-gateway
    command:
      - --nginx.scrape-uri=http://api-gateway/nginx_status

  # Local Catalog service web server for REST/API access during development.
  catalog-web:
    <<: *symfony-base
    container_name: catalog-web
    volumes:
      - ./catalog-service:/workspace
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      APP_SECRET: "${CATALOG_APP_SECRET:-catalog-dev-secret-change-me}"
      DATABASE_URL: "${CATALOG_DATABASE_URL:-postgresql://catalog:catalog@catalog-db:5432/catalog?serverVersion=16&charset=utf8}"
    command:
      - sh
      - -lc
      - /root/.symfony5/bin/symfony server:stop || true; /root/.symfony5/bin/symfony serve --allow-http --no-tls --listen-ip=0.0.0.0 --port=8000 --daemon; exec tail -f /dev/null
    ports:
      - "8010:8000"
    stdin_open: false
    tty: false

  # CLI PHP workspace for running Catalog service console commands.
  catalog-cli:
    <<: *symfony-base
    container_name: catalog-cli
    volumes:
      - ./catalog-service:/workspace
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      APP_SECRET: "${CATALOG_APP_SECRET:-catalog-dev-secret-change-me}"
      DATABASE_URL: "${CATALOG_DATABASE_URL:-postgresql://catalog:catalog@catalog-db:5432/catalog?serverVersion=16&charset=utf8}"
    command:
      - bash

  # Local Catalog gRPC server powered by RoadRunner.
  catalog-grpc:
    <<: *symfony-base
    container_name: catalog-grpc
    volumes:
      - ./catalog-service:/workspace
      - ./grpc-contracts:/grpc-contracts:ro
    depends_on:
      catalog-db:
        condition: service_healthy
    env_file:
      - .env
      - .env.local
      - ./catalog-service/.env.rr
    environment:
      APP_SECRET: "${CATALOG_APP_SECRET:-catalog-dev-secret-change-me}"
      DATABASE_URL: "${CATALOG_DATABASE_URL:-postgresql://catalog:catalog@catalog-db:5432/catalog?serverVersion=16&charset=utf8}"
    command:
      - rr
      - serve
      - -c
      - .rr.yaml
    ports:
      - "9011:9001"
    stdin_open: false
    tty: false

  # Local Cart service web server for REST/API access during development.
  cart-web:
    <<: *symfony-base
    container_name: cart-web
    volumes:
      - ./cart-service:/workspace
    depends_on:
      cart-db:
        condition: service_healthy
    environment:
      APP_SECRET: "${CART_APP_SECRET:-cart-dev-secret-change-me}"
      DATABASE_URL: "${CART_DATABASE_URL:-postgresql://cart:cart@cart-db:5432/cart?serverVersion=16&charset=utf8}"
    command:
      - sh
      - -lc
      - /root/.symfony5/bin/symfony server:stop || true; /root/.symfony5/bin/symfony serve --allow-http --no-tls --listen-ip=0.0.0.0 --port=8000 --daemon; exec tail -f /dev/null
    ports:
      - "8020:8000"
    stdin_open: false
    tty: false

  # CLI PHP workspace for running Cart service console commands.
  cart-cli:
    <<: *symfony-base
    container_name: cart-cli
    volumes:
      - ./cart-service:/workspace
    depends_on:
      cart-db:
        condition: service_healthy
    environment:
      APP_SECRET: "${CART_APP_SECRET:-cart-dev-secret-change-me}"
      DATABASE_URL: "${CART_DATABASE_URL:-postgresql://cart:cart@cart-db:5432/cart?serverVersion=16&charset=utf8}"
    command:
      - bash

  # Local SMTP catcher and web UI for inspecting outgoing development emails.
  mailpit:
    image: axllent/mailpit:latest
    container_name: symfony-mailpit
    command: ["--smtp-max-recipients", "1000"]
    ports:
      - "8025:8025"

  # RabbitMQ broker for Symfony Messenger async jobs.
  rabbitmq:
    image: rabbitmq:4-management
    container_name: symfony-rabbitmq
    env_file:
      - .env
      - .env.local
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # S3-compatible object storage for development file uploads and exports.
  minio:
    image: quay.io/minio/minio:latest
    container_name: symfony-minio
    env_file:
      - .env
      - .env.local
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - minio_data:/data

  # MinIO command-line client for bucket setup and storage maintenance commands.
  # Usage examples:
  # docker compose run --rm minio-client ls local
  # docker compose run --rm minio-client mb local/app --ignore-existing
  minio-client:
    image: quay.io/minio/mc:latest
    env_file:
      - .env
      - .env.local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -lc
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && exec mc "$$@"
      - mc

  # Local PlantUML renderer for documentation diagrams.
  # Usage examples:
  # docker compose run --rm plantuml -version
  # npm run docs:plantuml
  plantuml:
    image: plantuml/plantuml:1.2025.2
    working_dir: /workspace
    volumes:
      - .:/workspace


  # Prometheus time-series storage and scraper for local service metrics.
  prometheus:
    image: prom/prometheus:latest
    container_name: symfony-prometheus
    depends_on:
      - symfony-web
      - catalog-web
      - cart-web
      - api-gateway-exporter
      - node-exporter
      - postgres-exporter
      - catalog-postgres-exporter
      - cart-postgres-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Grafana dashboards for local monitoring.
  grafana:
    image: grafana/grafana:latest
    container_name: symfony-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  # Host/system exporter for CPU, RAM, filesystem, and network metrics.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: symfony-node-exporter
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  # PostgreSQL exporter for the main Symfony database.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: symfony-postgres-exporter
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?sslmode=disable"

  # PostgreSQL exporter for the Catalog database.
  catalog-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: catalog-postgres-exporter
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${CATALOG_POSTGRES_USER:-catalog}:${CATALOG_POSTGRES_PASSWORD:-catalog}@catalog-db:5432/${CATALOG_POSTGRES_DB:-catalog}?sslmode=disable"

  # PostgreSQL exporter for the Cart database.
  cart-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: cart-postgres-exporter
    depends_on:
      cart-db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${CART_POSTGRES_USER:-cart}:${CART_POSTGRES_PASSWORD:-cart}@cart-db:5432/${CART_POSTGRES_DB:-cart}?sslmode=disable"

volumes:
  database_data:
  catalog_database_data:
  cart_database_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
