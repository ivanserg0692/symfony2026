# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(CATALOG_READ_MODEL): 'doctrine'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $catalogReadModel: '%env(CATALOG_READ_MODEL)%'
            bool $useHasNextPagePagination: '%env(bool:CATALOG_PAGINATION_USE_HAS_NEXT_PAGE)%'
            int $catalogSectionsCacheTtlSeconds: '%env(int:CATALOG_SECTIONS_CACHE_TTL_SECONDS)%'
            string $elasticsearchUrl: '%env(ELASTICSEARCH_URL)%'
            string $elasticsearchUsername: '%env(ELASTICSEARCH_USERNAME)%'
            string $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'
            string $productSearchIndexPrefix: '%env(PRODUCT_SEARCH_INDEX_PREFIX)%'
            string $productSearchIndexAlias: '%env(PRODUCT_SEARCH_INDEX_ALIAS)%'
            int $productSearchResultWindow: '%env(int:PRODUCT_SEARCH_RESULT_WINDOW)%'
            int $productSearchBatchSize: '%env(int:PRODUCT_SEARCH_BATCH_SIZE)%'
            int $productSearchReindexLockId: '%env(int:PRODUCT_SEARCH_REINDEX_LOCK_ID)%'
            bool $productSearchIncrementalWorkerPaused: '%env(bool:PRODUCT_SEARCH_INCREMENTAL_WORKER_PAUSED)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Grpc/Generated/'

    App\Search\Product\Port\Output\CatalogReadInterface:
        factory: ['@App\Search\Product\Infrastructure\CatalogReadFactory', 'create']

    App\Search\Product\Port\Output\CatalogSectionReadInterface:
        factory: ['@App\Search\Product\Infrastructure\CatalogSectionReadFactory', 'create']

    app.catalog_read.elasticsearch_client:
        class: Elastic\Elasticsearch\Client
        factory: ['@App\Search\Product\Infrastructure\Elasticsearch\ElasticsearchClientFactory', 'create']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    services:
        App\RoadRunner\Grpc\GrpcDataCollector:
            tags:
                -
                    name: data_collector
                    template: 'profiler/grpc.html.twig'
                    id: 'app.grpc'

        App\RoadRunner\Grpc\GrpcProfilerContext:
            arguments:
                $requestStack: '@.virtual_request_stack'

        App\RoadRunner\Grpc\RoadRunnerGrpcRunner:
            public: true
            autowire: true
            autoconfigure: true
            arguments:
                $profiler: '@profiler'
